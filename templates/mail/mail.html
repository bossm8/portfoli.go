{{ define "mail" }}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body style="margin:0; padding:0; background-color:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 16px;">
            <tr>
                <td align="center">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e4e4e7;">
                        <tr>
                            <td style="background-color:#475569; padding:20px 24px;">
                                <span style="color:#ffffff; font-size:16px; font-weight:700;">New portfolio message</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding:24px;">
                                <p style="margin:0 0 4px; font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.04em;">From</p>
                                <p style="margin:0 0 20px; font-size:15px; color:#18181b;">{{ .Name }} &lt;{{ .Email }}&gt;</p>
                                <p style="margin:0 0 4px; font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.04em;">Message</p>
                                <p style="margin:0; font-size:15px; line-height:1.6; color:#18181b; white-space:pre-wrap;">{{ .Message }}</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
{{ end }}
