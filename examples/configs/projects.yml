# Your projects
projects:
    # Name of the project
  - name: Gopher Artwork
    # Link to e.g. the website of your project
    link: https://github.com/bossm8/portfoli.go/tree/main/public/img
    # Optional image (either url or path starting from /static)
    image: /static/img/portfoli.go-gray.svg
    # A description of the project, this may be HTML content
    description: |
      <div>
        A little collection of gopher illustrations drawn for this project -
        used everywhere from the 404 page to the contact form. Renée French,
        we owe you one. Follow the link above for the full set.
      </div>
      <div class="img-gallery">
        <img src='{{ "/static/img/status/404.svg" | Assemble }}' alt="Much Wow"/>
        <img src='{{ "/static/img/status/error.svg" | Assemble }}' alt="Hmm - cannot find this"/>
        <img src='{{ "/static/img/status/delivered.svg" | Assemble }}' alt="Might be missing too"/>
        <img src='{{ "/static/img/status/undelivered.svg" | Assemble }}' alt="No idea what else I could write here"/>
      </div>

  - name: Portfoli.go
    link: /about
    description: |
      <div class="mb-3">
        <strong>The simple and flexible portfolio written in Go.</strong>
      </div>
      <div class="mt-3">
        There could be written a lot about it.
        However most information is written in the source code repository on GitHub:
      </div>
      <div class="mt-4">
        <a href="https://github.com/bossm8/portfoli.go" target="_blank" class="btn btn-primary">
          <i class="bi bi-github me-2"></i>Source Code
        </a>
      </div>
